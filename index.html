<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b2a8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mağaza Cep">
  <meta name="referrer" content="no-referrer">
  <title>Mağaza Takip Cep</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root { --bg: #f5f4fa; --panel: #fff; --ink: #1d1a2b; --muted: #6b6880; --line: #e6e3f0; --brand: #3b2a8c; --brand2: #5b45c9;
      --green: #1f8a5b; --green-bg: #e7f6ee; --yellow: #a86b00; --yellow-bg: #fff4dc; --red: #c62f3a; --red-bg: #fde9eb; --blue: #2a62c9; --blue-bg: #e8f0fd; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
    header img { width: 30px; height: 30px; border-radius: 8px; }
    header .t { font-weight: 700; font-size: 16px; } header .s { font-size: 12px; opacity: .8; }
    header .grow { flex: 1; } header button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
    main { padding: 14px 16px; max-width: 720px; margin: 0 auto; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
    nav button { flex: 1; border: 0; background: none; padding: 9px 0 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
    nav button.on { color: var(--brand); font-weight: 700; } nav svg { width: 22px; height: 22px; }
    nav .b { position: absolute; top: 4px; left: 55%; background: var(--red); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; font-style: normal; }
    h2 { font-size: 20px; margin: 4px 0 12px; } h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 10px; } .grow { flex: 1; min-width: 0; } .muted { color: var(--muted); } .small { font-size: 13px; } .bold { font-weight: 700; }
    .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600; }
    .btn.p { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.g { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.sm { padding: 7px 11px; font-size: 13px; } .btn.w { width: 100%; } .btn:disabled { opacity: .5; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .st-hazir { background: var(--yellow-bg); color: var(--yellow); } .st-kargo { background: var(--blue-bg); color: var(--blue); } .st-teslim { background: var(--green-bg); color: var(--green); }
    .new { background: var(--red); color: #fff; } .rev { background: var(--yellow-bg); color: var(--yellow); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .stats .card { margin: 0; } .k { font-size: 12px; color: var(--muted); } .v { font-size: 20px; font-weight: 800; }
    input, textarea, select { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--ink); }
    textarea { min-height: 160px; } label.f { display: block; margin-bottom: 10px; font-size: 13px; color: var(--muted); } label.f input, label.f select { margin-top: 4px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; } .chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
    .chips button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .step { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); } .step:last-child { border: 0; }
    .step .cb { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; }
    .step.done .cb { background: var(--green); border-color: var(--green); } .step.lock { opacity: .55; } .step .w { font-size: 12px; color: var(--muted); }
    .bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--green); }
    .sheet { position: fixed; inset: 0; background: rgba(20,16,40,.45); z-index: 20; display: flex; align-items: flex-end; }
    .sheet > div { background: var(--bg); width: 100%; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); background: #1d1a2b; color: #fff; padding: 12px 14px; border-radius: 12px; z-index: 30; font-size: 14px; }
    .center { text-align: center; } .pin { font-size: 28px; letter-spacing: 12px; text-align: center; }
    .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
    .warn { background: var(--yellow-bg); border-color: #f1d9a3; } .err { background: var(--red-bg); border-color: #f3c3c8; }
    .thumbless { width: 40px; height: 40px; border-radius: 10px; background: var(--line); flex: none; display: grid; place-items: center; font-weight: 800; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"><main><div class="empty">Yükleniyor…</div></main></div>
  <script type="module" src="app.js"></script>
</body>
</html>
